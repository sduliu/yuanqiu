<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>圜丘坛 · 识坛</title>
<!--
  圜丘坛 · 识坛 —— 课件引子：自由观察 3D 圜丘坛，点坛识形制，张丘建讲解
  · 坛：Three.js 真 3D（src/altar3d.js → tools/build3d.mjs 打包为 assets/altar3d.js），左键旋转、右键/Shift 拖动平移、滚轮或双指缩放
  · 背景：草书、远山、祥云、竹、仙鹤、雾为矢量分层视差；祈年殿用实拍照片抠图（assets/qiniandian.webp）融入雾中
  · 配音：assets/voice/*.mp3（tools/gen_voice.sh 生成，文本在 tools/lines.json）；配音文本将"圜"读作 yuán
  · 张丘建形象：分层插画立绘（身体/手/下巴，base64 webp 内嵌），canvas 逐帧：挥手、口型随配音进度张合、眨眼、呼吸
  · 尺寸依据 research/圜丘坛-尺寸考证.md
  双击即可打开，无需联网。
-->
<style>
  :root{--paper:#F4F1EA;--ink:#2F3431;--seal:#A34232;--muted:#69685E;--rule:#C9C2B2;--ui-font:"Microsoft YaHei","PingFang SC",sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#EFEBE2}
  body{font-family:KaiTi,"楷体","STKaiti",serif;color:var(--ink);user-select:none}
  #stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;overflow:hidden;background:var(--paper);transform-origin:50% 50%;transform:translate(-50%,-50%)}
  .layer{position:absolute;inset:0;width:1600px;height:900px;pointer-events:none;transition:transform .6s cubic-bezier(.2,.7,.3,1)}
  #gl{position:absolute;inset:0;width:1600px;height:900px;touch-action:none;cursor:grab;
    /* 坛只在人物左侧显示，放大时淡入雾中，不与张丘建重叠 */
    -webkit-mask-image:linear-gradient(90deg,#000 0,#000 1040px,transparent 1180px);mask-image:linear-gradient(90deg,#000 0,#000 1040px,transparent 1180px)}
  #gl:active{cursor:grabbing}
  #qnd{position:absolute;left:128px;top:360px;height:300px;opacity:.3;
    filter:saturate(.35) sepia(.18) contrast(.8) brightness(1.12);
    -webkit-mask-image:linear-gradient(#000 72%,transparent 100%);mask-image:linear-gradient(#000 72%,transparent 100%)}

  .drift{animation:drift linear infinite alternate}
  @keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(60px)}}
  .sway{animation:sway 6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 0%}
  @keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2.5deg)}}
  .wing{transform-box:fill-box;transform-origin:0% 100%;animation:flap 1.8s ease-in-out infinite alternate}
  .wing.far{animation-delay:-.15s}
  @keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-.55)}}
  .fly{animation:fly 70s linear infinite}
  @keyframes fly{from{transform:translate(0,0)}to{transform:translate(-1900px,-160px)}}
  .flow{stroke-dasharray:6 10;animation:flow 14s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-320}}

  /* 画轴字幕 */
  #scroll{position:absolute;left:120px;top:736px;width:1380px;height:132px;pointer-events:none}
  #scroll .paper{position:absolute;left:12px;right:12px;top:6px;bottom:6px;
    background:#FAF7F0;box-shadow:0 5px 16px rgba(62,58,44,.08);
    clip-path:inset(0 50% 0 50%);transition:clip-path 1.1s cubic-bezier(.3,.7,.2,1)}
  #scroll.open .paper{clip-path:inset(0 0 0 0)}
  #scroll .paper::before,#scroll .paper::after{content:"";position:absolute;left:0;right:0;height:1px;background:var(--rule)}
  #scroll .paper::before{top:9px}#scroll .paper::after{bottom:9px}
  .roller{position:absolute;top:0;width:22px;height:132px;border-radius:7px;
    background:linear-gradient(90deg,#B6A78B,#E0D6C2 40%,#E9E1D1 60%,#BCAF95);
    box-shadow:2px 4px 7px rgba(80,65,40,.12);transition:left 1.1s cubic-bezier(.3,.7,.2,1)}
  .roller::before,.roller::after{content:"";position:absolute;left:3px;width:16px;height:8px;border-radius:50%;background:#857359}
  .roller::before{top:-4px}.roller::after{bottom:-4px}
  #rollL,#rollR{left:673px}
  #scroll.open #rollL{left:0}#scroll.open #rollR{left:1358px}
  #scroll .paint{position:absolute;inset:0;opacity:0;transition:opacity .8s .6s}
  #scroll.open .paint{opacity:.28}
  #cap{position:absolute;left:124px;right:124px;top:18px;bottom:18px;padding-left:60px;display:flex;align-items:center;justify-content:center;
    text-align:left;font-family:"SimSun","Songti SC",serif;font-size:26px;line-height:1.65;letter-spacing:1px;color:var(--ink);opacity:0;transition:opacity .4s}
  #cap.on{opacity:1}
  #cap.long{font-size:22px;line-height:1.6;letter-spacing:.5px}
  #cap .who{position:absolute;left:0;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;white-space:nowrap;
    font-size:15px;letter-spacing:2px;color:#fff;background:var(--seal);padding:8px 4px;border-radius:2px}

  /* 张丘建（分层立绘：挥手 + 口型 + 眨眼，canvas 逐帧绘制） */
  #npc{position:absolute;left:1272px;top:266px;width:280px;height:470px;cursor:pointer;overflow:visible}
  #npc .shadow{position:absolute;left:60px;bottom:-6px;width:180px;height:18px;border-radius:50%;background:#5A5348;opacity:.18;filter:blur(3px)}
  #npcCv{position:absolute;left:50%;bottom:0;height:470px;margin-left:-62px;transform:translateX(-50%);transform-origin:73% 100%;filter:saturate(.72) drop-shadow(0 5px 7px rgba(60,50,35,.12))}
  #npc:hover #npcCv{filter:saturate(.85) drop-shadow(0 5px 9px rgba(60,50,35,.18))}

  /* 标题、按钮、开场 */
  #title{position:absolute;left:62px;top:126px;writing-mode:vertical-rl;font-size:54px;letter-spacing:18px;color:var(--ink);pointer-events:none}
  #title small{display:block;font-size:17px;letter-spacing:6px;color:var(--muted);margin-right:14px;margin-top:8px}
  #seal{position:absolute;left:76px;top:392px;width:38px;height:38px;background:var(--seal);color:#F7F0E2;font-size:14px;
    writing-mode:vertical-rl;display:grid;place-items:center;letter-spacing:2px;border-radius:3px;pointer-events:none}
  .ui{position:absolute;top:28px;right:42px;display:flex;gap:12px}
  .ui button,.view button{font-family:var(--ui-font);font-size:15px;letter-spacing:1px;padding:10px 16px;min-height:44px;background:#F8F5EE;
    border:1px solid var(--rule);color:var(--ink);cursor:pointer;border-radius:3px;transition:background .2s,border-color .2s,transform .2s}
  .ui button:hover,.view button:hover{background:#EAE5D9;border-color:#8D958A}
  button:focus-visible{outline:2px solid var(--seal);outline-offset:4px}
  button:active{transform:translateY(1px)}
  .view{position:absolute;left:1172px;top:468px;display:flex;flex-direction:column;gap:8px}
  .view button{width:48px;height:44px;padding:0;font-size:17px;letter-spacing:0}
  .help{position:absolute;left:440px;top:42px;font-family:var(--ui-font);font-size:15px;letter-spacing:1px;color:var(--muted);pointer-events:none}
  #intro{position:absolute;inset:0;display:grid;place-items:center;background:rgba(244,241,234,.55);
    backdrop-filter:blur(2px);transition:opacity .8s;z-index:20}
  #intro.gone{opacity:0;pointer-events:none}
  #intro .card{text-align:center}
  #intro h2{font-weight:normal;font-size:60px;letter-spacing:18px;color:var(--ink)}
  #intro p{font-size:20px;letter-spacing:6px;color:#7A6E5C;margin:14px 0 34px}
  #intro button{font-family:inherit;font-size:24px;letter-spacing:10px;padding:12px 40px 12px 50px;background:var(--seal);
    color:#F7F0E2;border:none;cursor:pointer;border-radius:2px;box-shadow:0 5px 14px rgba(120,40,30,.14)}
</style>
</head>
<body>
<div id="stage">
  <svg class="layer" id="Lfar" viewBox="0 0 1600 900"></svg>
  <div class="layer" id="LfarImg"><img id="qnd" src="assets/qiniandian.webp" alt="" onerror="this.style.display='none'"></div>
  <svg class="layer" id="Lmid" viewBox="0 0 1600 900"></svg>
  <canvas id="gl" width="1600" height="900"></canvas>
  <svg class="layer" id="Lfront" viewBox="0 0 1600 900"></svg>
  <div id="title">圜丘坛<small>识 坛 · 九 重 天</small></div>
  <div id="seal">识坛</div>
  <div class="help">左键拖动旋转 · 右键拖动平移 · 滚轮缩放</div>
  <div id="npc" title="张丘建"><div class="shadow"></div><canvas id="npcCv"></canvas></div>
  <div id="scroll">
    <div class="paper"></div>
    <svg class="paint" viewBox="0 0 1380 156"></svg>
    <div id="cap"><span class="who">张丘建</span><span id="capText"></span></div>
    <div class="roller" id="rollL"></div><div class="roller" id="rollR"></div>
  </div>
  <div class="view">
    <button id="vIn" title="放大">＋</button><button id="vOut" title="缩小">－</button>
    <button id="vTop" title="俯视">俯</button><button id="vHome" title="复位">复</button>
  </div>
  <div class="ui"><button id="btnVoice">语音 · 开</button><button id="btnFull">全屏</button></div>
  <div id="intro"><div class="card"><h2>走进圜丘坛</h2><p>张丘建带你探索圜丘坛</p><button id="btnStart">开 始</button></div></div>
</div>
<script>/* 先按窗口缩放居中，避免脚本加载期间画面偏到右下角 */(function(){var k=Math.min(innerWidth/1600,innerHeight/900);document.getElementById('stage').style.transform='translate(-50%,-50%) scale('+k+')';})();</script>
<script src="assets/altar3d.js"></script>
<script>
(function(){
'use strict';
var NS='http://www.w3.org/2000/svg';
function el(tag,a,parent){var e=document.createElementNS(NS,tag);if(a)for(var k in a)e.setAttribute(k,a[k]);if(parent)parent.appendChild(e);return e;}
function rnd(seed){var s=seed;return function(){s=(s*16807)%2147483647;return (s-1)/2147483646;};}
function defs(svg){return svg.querySelector('defs')||el('defs',{},svg);}
function blur(svg,id,sd){var f=el('filter',{id:id,x:'-20%',y:'-20%',width:'140%',height:'140%'},defs(svg));el('feGaussianBlur',{stdDeviation:sd},f);return 'url(#'+id+')';}

/* ================= 舞台缩放 ================= */
var stage=document.getElementById('stage'),scale=1,altar=null;
function fit(){scale=Math.min(innerWidth/1600,innerHeight/900);stage.style.transform='translate(-50%,-50%) scale('+scale+')';if(altar)altar.setPixelScale(scale);}

/* ================= 远景：宣纸、草书、远山 ================= */
var far=document.getElementById('Lfar'),R=rnd(9);
(function(){
  var f=el('filter',{id:'paperN',x:0,y:0,width:'100%',height:'100%'},defs(far));
  el('feTurbulence',{type:'fractalNoise',baseFrequency:'.75',numOctaves:3,seed:4},f);
  el('feColorMatrix',{type:'matrix',values:'0 0 0 0 .45 0 0 0 0 .40 0 0 0 0 .32 0 0 0 .07 0'},f);
  var g=el('radialGradient',{id:'paperG',cx:'.45',cy:'.35',r:'.8'},defs(far));
  el('stop',{offset:0,'stop-color':'#FBFAF6'},g);el('stop',{offset:.7,'stop-color':'#F2EEE5'},g);el('stop',{offset:1,'stop-color':'#E6E0D3'},g);
  el('rect',{width:1600,height:900,fill:'url(#paperG)'},far);
  el('rect',{width:1600,height:900,filter:'url(#paperN)'},far);
  // 草书墨迹（《礼记·郊特牲》《周礼·大司乐》），斜切 + 模糊，若隐若现
  var txt='郊之祭也迎长日之至也大报天而主日也兆于南郊就阳位也冬日至于地上之圜丘奏之若乐六变则天神皆降可得而礼矣';
  var gC=el('g',{filter:blur(far,'calB',1.6),opacity:.014},far),idx=0;
  for(var c=0;c<13;c++){
    var x=1540-c*112+R()*20,y0=40+R()*60,col=el('g',{transform:'translate('+x+' '+y0+') skewY(-4) skewX(-10)'},gC);
    for(var r=0;r<7;r++){
      var t=el('text',{x:0,y:r*86+R()*14,'font-size':72+R()*30,'font-family':'KaiTi','text-anchor':'middle',fill:'#4A4033',
        transform:'rotate('+(R()*16-8)+' 0 '+(r*86)+') scale('+(0.8+R()*.5)+' '+(1.1+R()*.5)+')'},col);
      t.textContent=txt[idx++%txt.length];
    }
  }
  var tg=el('linearGradient',{id:'topWash',x1:0,y1:0,x2:0,y2:1},defs(far));
  el('stop',{offset:0,'stop-color':'#D9D3C6','stop-opacity':.18},tg);el('stop',{offset:1,'stop-color':'#D9D3C6','stop-opacity':0},tg);
  el('rect',{width:1600,height:230,fill:'url(#topWash)'},far);
  var mG=el('linearGradient',{id:'mG',x1:0,y1:0,x2:0,y2:1},defs(far));
  el('stop',{offset:0,'stop-color':'#8FA3B0','stop-opacity':.85},mG);el('stop',{offset:.55,'stop-color':'#B9C6CD','stop-opacity':.45},mG);el('stop',{offset:1,'stop-color':'#E9ECEA','stop-opacity':0},mG);
  var mG2=el('linearGradient',{id:'mG2',x1:0,y1:0,x2:0,y2:1},defs(far));
  el('stop',{offset:0,'stop-color':'#5E6E78','stop-opacity':.75},mG2);el('stop',{offset:.6,'stop-color':'#9AA9B1','stop-opacity':.3},mG2);el('stop',{offset:1,'stop-color':'#E9ECEA','stop-opacity':0},mG2);
  function ridge(base,amp,seed,step,fill,f,op){
    var rr=rnd(seed),d='M-40 900 L-40 '+base,x=-40,y=base;
    while(x<1640){var nx=x+step*(0.6+rr()*0.8),ny=base-amp*Math.pow(rr(),1.6);d+=' Q'+(x+nx)/2+' '+(Math.min(y,ny)-amp*0.25*rr())+' '+nx+' '+ny;x=nx;y=ny;}
    d+=' L1640 900Z';return el('path',{d:d,fill:fill,filter:f,opacity:op},far);
  }
  ridge(600,170,3,160,'url(#mG)',blur(far,'m1',5),.28);
  ridge(650,120,8,120,'url(#mG2)',blur(far,'m2',2.5),.24);
  ridge(700,90,15,90,'url(#mG2)',blur(far,'m3',1.2),.16);
  for(var b=0;b<7;b++){var bx=1180+R()*160,by=170+R()*70;el('path',{d:'M'+bx+' '+by+' q4 -4 8 0 q4 -4 8 0',fill:'none',stroke:'#4A4540','stroke-width':1.2,opacity:.45},far);}
})();

/* ================= 中景：金线、祥云、竹、仙鹤 ================= */
var mid=document.getElementById('Lmid');
(function(){
  var gl=el('g',{opacity:.16},mid);
  for(var i=0;i<6;i++){
    el('path',{d:'M-20 '+(560+i*9)+' C120 '+(520+i*6)+' 220 '+(620+i*8)+' 360 '+(600+i*5)+' S560 '+(560+i*7)+' 720 '+(585+i*4),
      fill:'none',stroke:i%2?'#D8BE8C':'#C7A46E','stroke-width':i%3?0.8:1.4,'class':i%2?'flow':''},gl);
  }
  function cloud(x,y,s,flip,op,dur){
    var w=el('g',{'class':'drift'},mid),g=el('g',{transform:'translate('+x+' '+y+') scale('+(flip?-s:s)+' '+s+')',opacity:op},w);
    w.style.animationDuration=dur+'s';
    el('path',{d:'M0 46 C-26 46 -30 14 -6 8 C-6 -18 30 -26 44 -4 C52 -30 96 -26 98 4 C124 0 132 34 108 46 Z',fill:'#CDAA7C'},g);
    el('path',{d:'M14 30 C14 14 36 12 38 26 C40 36 26 38 24 30 M62 24 C62 8 86 6 88 22 C90 32 76 34 74 26',fill:'none',stroke:'#F4EEE2','stroke-width':4,'stroke-linecap':'round'},g);
    el('path',{d:'M108 46 C140 50 150 76 190 66 C170 84 130 82 108 62',fill:'#CDAA7C'},g);
  }
  cloud(36,620,.7,false,.15,40);cloud(1250,140,.5,true,.12,48);
  var bam=el('g',{opacity:.26,filter:blur(mid,'bm',.4)},mid);
  [[0,-10,250,190],[30,-20,330,150]].forEach(function(s){el('path',{d:'M'+s[0]+' '+s[1]+' Q'+(s[2]*.4)+' '+(s[3]*.3)+' '+s[2]+' '+s[3],fill:'none',stroke:'#9E8460','stroke-width':2.2},bam);});
  var lr=rnd(21);
  for(var k=0;k<15;k++){
    var px=20+lr()*300,py=10+lr()*190,ang=20+lr()*70,len=60+lr()*45;
    var g=el('g',{transform:'translate('+px+' '+py+') rotate('+ang+')'},bam);
    var leaf=el('path',{d:'M0 0 Q'+len*.35+' -9 '+len+' 0 Q'+len*.35+' 9 0 0Z',fill:k%3?'#A88B63':'#8E7350','class':'sway'},g);
    leaf.style.animationDelay=(-lr()*6)+'s';leaf.style.animationDuration=(5+lr()*3)+'s';
  }
  function crane(x,y,s,delay,dur){
    var w=el('g',{'class':'fly'},mid);w.style.animationDelay=delay+'s';w.style.animationDuration=dur+'s';
    var g=el('g',{transform:'translate('+x+' '+y+') scale('+s+')'},w);
    el('path',{d:'M-2 -6 Q16 -44 58 -70 Q48 -44 40 -32 Q26 -12 14 -4Z',fill:'#F7F5F0',stroke:'#59544D','stroke-width':1.2,'class':'wing far'},g);
    el('path',{d:'M34 4 L64 8 M34 7 L64 12',stroke:'#6A645B','stroke-width':1.5},g);
    el('path',{d:'M32 -2 L46 2 L34 7Z',fill:'#2A2724'},g);
    el('ellipse',{cx:4,cy:0,rx:32,ry:9.5,fill:'#FBFAF7',stroke:'#59544D','stroke-width':1.2},g);
    el('path',{d:'M-24 -3 Q-48 -10 -70 -6',fill:'none',stroke:'#2A2724','stroke-width':4.5,'stroke-linecap':'round'},g);
    el('circle',{cx:-72,cy:-6,r:4.4,fill:'#FBFAF7',stroke:'#2A2724','stroke-width':1},g);
    el('circle',{cx:-72,cy:-9.5,r:2.4,fill:'#C8382B'},g);
    el('path',{d:'M-76 -5 L-96 -1',stroke:'#7C7058','stroke-width':2.2,'stroke-linecap':'round'},g);
    var wg=el('g',{'class':'wing'},g);
    el('path',{d:'M-8 -4 Q8 -52 52 -86 Q44 -56 36 -42 Q22 -16 10 -2Z',fill:'#FFFFFF',stroke:'#59544D','stroke-width':1.2},wg);
    el('path',{d:'M52 -86 Q44 -60 38 -46 L30 -50 Q40 -66 52 -86Z',fill:'#2A2724'},wg);
  }
  crane(1760,210,.42,-8,110);
})();

/* ================= 前景：雾、毛笔 ================= */
var front=document.getElementById('Lfront');
(function(){
  var mb=blur(front,'mist',28);
  [[230,700,320,50,.75,40],[620,742,420,42,.55,55],[1100,705,380,50,.6,47],[1450,650,260,60,.55,38],[60,640,240,50,.6,60]].forEach(function(m){
    var e=el('ellipse',{cx:m[0],cy:m[1],rx:m[2],ry:m[3],fill:'#FFFFFF',opacity:m[4],filter:mb,'class':'drift'},front);
    e.style.animationDuration=m[5]+'s';e.style.animationDelay=(-m[5]/2)+'s';});
  var g=el('g',{transform:'translate(1528 840)',opacity:.16},front);
  el('path',{d:'M-60 20 C-80 0 -50 -30 -20 -18 C0 -40 40 -20 30 10 C50 20 20 40 -10 34 C-40 44 -70 36 -60 20Z',fill:'#3A3734',opacity:.55,filter:blur(front,'inkb',3)},g);
  el('line',{x1:-6,y1:4,x2:52,y2:-120,stroke:'#2B2622','stroke-width':9,'stroke-linecap':'round'},g);
  el('path',{d:'M-6 4 Q-26 30 -32 40 Q-12 30 4 12Z',fill:'#1E1C1A'},g);
  el('line',{x1:52,y1:-120,x2:58,y2:-134,stroke:'#C0392B','stroke-width':3},g);
})();

/* ================= 画轴淡彩 ================= */
(function(){
  var ps=document.querySelector('#scroll .paint'),g=el('g',{opacity:.38},ps);
  [[70,120,70,'#7D8A90'],[140,124,50,'#9AA6AB'],[1180,118,80,'#7D8A90'],[1260,124,46,'#9AA6AB']].forEach(function(m){
    el('path',{d:'M'+(m[0]-m[2])+' 140 Q'+(m[0]-m[2]*.4)+' '+(m[1]-m[2]*.55)+' '+m[0]+' '+(m[1]-m[2]*.7)+' Q'+(m[0]+m[2]*.3)+' '+(m[1]-m[2]*.3)+' '+(m[0]+m[2])+' 140Z',fill:m[3]},g);});
  var b=el('g',{transform:'translate(1290 46)',opacity:.5},ps);
  el('path',{d:'M-30 0 Q0 10 30 0 L24 6 Q0 12 -24 6Z',fill:'#5A544C'},b);el('line',{x1:10,y1:0,x2:20,y2:-22,stroke:'#5A544C','stroke-width':1.4},b);
})();

/* ================= 张丘建：分层立绘逐帧动画 ================= */
var npc=document.getElementById('npc'),talking=false;

  var sc=1+.0025*Math.sin(t*1.25),rot=-.5*p+(talking?.25*Math.sin(t*1.7)*mouth:0);
  cv.style.transform='translateX(-50%) rotate('+rot.toFixed(3)+'deg) scale('+sc.toFixed(4)+','+(1+(sc-1)*2).toFixed(4)+')';
  if(talking&&speech.text&&progress(now)>=1&&(!audio||audio.paused||!voiceOn))stopTalk();
  requestAnimationFrame(drawNPC);
}
requestAnimationFrame(drawNPC);

/* ================= 说话：字幕 + 配音 ================= */
var LINES={
  intro:'老夫是张丘建，这便是圜丘坛，今天就让我带领大家探索学习吧。点一点石板或坛外有意外惊喜哦！',
  center:'天心石',ring1:'第一圈，9块石板。',ring9:'第9圈，81块石板。',
  tier1:'第一层，共9圈，每圈石板数量成等差数列。',tier2:'第二层，共9圈，每圈石板数量成等差数列。',tier3:'第三层，共9圈，每圈石板数量成等差数列。',
  culture:'圜丘坛为明清两代皇帝在冬至日举行祭天大典的场所。坛面、栏板、台阶的数量均为“九”或九的倍数，象征“九重天”，将建筑形制与祭天礼制融为一体，强化“天人合一”的神圣意境与仪式的庄严感。',
  tip1:'老夫著有《张丘建算经》，书中便有等差数列的算题。',tip2:'莫只看老夫，去点一点坛上的石板吧。',tip3:'按住拖动可以转着看圜丘坛，滚轮可以放大缩小。'
};
var capEl=document.getElementById('cap'),capText=document.getElementById('capText');
var voiceOn=true,audio=null,typeTimer=null,talkTimer=null;
function stopTalk(){talking=false;npc.classList.remove('talk');if(speech.text)capText.textContent=speech.text;}
function say(key){
  var text=LINES[key];window.__last=text;window.__key=key;
  capEl.classList.remove('on');speech.text='';
  if(audio){audio.pause();audio.onended=null;}
  stopTalk();
  clearTimeout(talkTimer);
  prep(text);
  talkTimer=setTimeout(function(){
    capText.textContent='';speech.shown=-1;capEl.classList.toggle('long',text.length>60);capEl.classList.add('on');
    speech.text=text;speech.start=performance.now();speech.dur=speech.tot*215;
    talking=true;npc.classList.add('talk');
    if(!voiceOn)return;
    audio=new Audio('assets/voice/'+key+'.mp3?v=kokoro3');
    audio.onended=function(){capText.textContent=text;stopTalk();};
    audio.play().catch(function(){speech.start=performance.now();});
  },140);
}

/* ================= 3D 坛 ================= */
var started=false,tipI=0;
addEventListener('resize',fit);fit();
var NOOP=function(){};
if(!window.Altar3D){
  window.Altar3D={create:function(){return {setPixelScale:NOOP,intro:NOOP,zoom:NOOP,top:NOOP,home:NOOP};}};
  var w=document.createElement('div');w.style.cssText='position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);font-size:22px;letter-spacing:2px;color:#B23A2E;background:rgba(255,255,255,.85);padding:14px 22px;border:1px solid #B23A2E;z-index:5;text-align:center';
  w.innerHTML='未找到 assets/altar3d.js，3D 坛无法显示。<br>请把本文件放回课件原文件夹（与 assets 文件夹同级）再打开。';stage.appendChild(w);
}
altar=Altar3D.create(document.getElementById('gl'),{width:1600,height:900,offsetX:-70,
  onPick:function(r){
    if(!started)return;
    var key=!r?'culture':r.kind==='center'?'center':(r.kind==='ring'&&r.n===1)?'ring1':(r.kind==='ring'&&r.n===9)?'ring9':'tier'+(r.t+1);
    window.__hit=key;say(key);
  }});
fit();
npc.addEventListener('click',function(){if(started)say('tip'+(tipI++%3+1));});

/* ================= 视差 ================= */
var farImg=document.getElementById('LfarImg');
stage.addEventListener('mousemove',function(e){
  var b=stage.getBoundingClientRect(),mx=(e.clientX-b.left)/b.width-.5,my=(e.clientY-b.top)/b.height-.5;
  far.style.transform=farImg.style.transform='translate('+(-mx*4)+'px,'+(-my*3)+'px)';
  mid.style.transform='translate('+(-mx*9)+'px,'+(-my*5)+'px)';
  front.style.transform='translate('+(-mx*14)+'px,'+(-my*7)+'px)';
});

/* ================= 开场与按钮 ================= */
document.getElementById('btnStart').addEventListener('click',function(){
  started=true;document.getElementById('intro').classList.add('gone');
  document.getElementById('scroll').classList.add('open');
  altar.intro(3200);
  setTimeout(function(){say('intro');},900);
});
document.getElementById('vIn').onclick=function(){altar.zoom(.7);};
document.getElementById('vOut').onclick=function(){altar.zoom(1.4);};
document.getElementById('vTop').onclick=function(){altar.top();};
document.getElementById('vHome').onclick=function(){altar.home();};
document.getElementById('btnVoice').addEventListener('click',function(){
  voiceOn=!voiceOn;this.textContent='语音 · '+(voiceOn?'开':'关');if(!voiceOn&&audio)audio.pause();
});
document.getElementById('btnFull').addEventListener('click',function(){
  if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();
});
window.__altar=altar;window.__ready=true;
})();
</script>
